server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: serviceflow-ai-backend-java
  datasource:
    # 凭据全部来自环境变量，源码中不出现真实密码
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:serviceflow}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectTimeout=3000&socketTimeout=5000
    username: ${MYSQL_USER:serviceflow}
    password: ${MYSQL_PASSWORD:}
    hikari:
      pool-name: serviceflow-pool
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      # -1 表示数据库暂不可用时也允许应用启动，由 /api/health/ready 如实报告数据库状态
      initialization-fail-timeout: -1

logging:
  level:
    root: info
    com.serviceflow.ai: info
