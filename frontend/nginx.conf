# ServiceFlow AI 前端站点：静态资源 + /api 反向代理
server {
    listen 80;
    server_name _;

    # 隐藏 nginx 版本号（后端版本由 server-header="" 处理）
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    # 安全响应头（对所有响应生效；location 内不要再写 add_header，否则会覆盖继承）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP：脚本只允许同源；样式允许 unsafe-inline 是因为 ECharts/Vue 会写元素内联样式。
    # 启用 HTTPS 后追加：add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # 入口 HTML 不缓存，避免发布后仍加载旧版本
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # 容器健康检查专用，不写访问日志
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 就绪检查包含依赖细节，仅限容器/内网；容器健康检查直接访问后端，不经过 nginx
    location = /api/health/ready {
        return 403;
    }

    # 后端 API：同源代理，前端无需跨域；保留 nginx 生成的请求 ID 供后端日志串联
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加客户端自带的 XFF，防止伪造来源 IP 写入审计日志
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        # AI 分析读超时为 90 秒，网关留出余量
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }

    # OpenAPI 文档：随前端同源暴露，免开后端端口
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # 带 hash 的构建产物可长期缓存（expires 不覆盖 server 级安全头）
    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
