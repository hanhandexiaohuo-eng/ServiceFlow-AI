name: CI

# 说明：
# - 不注入任何真实密钥；测试只使用 Mock，不调用 DeepSeek，也不连接外部 MySQL。
# - 后端 156+ 个测试均为纯单元测试（Mockito/MockMvc standalone），无需数据库服务。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 密钥扫描先行：命中密码/Token/API Key/私钥即阻断后续构建
  secret-scan:
    name: 敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 扫描工作区（源码 / 配置 / 文档）
        run: python3 scripts/scan_secrets.py --root .

  backend:
    name: Java 构建与测试
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven 构建（含全部单元测试）
        run: |
          chmod +x mvnw
          ./mvnw -B clean package
      - name: 扫描构建产物
        run: python3 ../scripts/scan_secrets.py --root .

  python:
    name: Python AI 测试
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-python
    steps:
      - uses: actions/checkout@v4
      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-python/requirements-dev.txt
      - name: 安装依赖
        run: pip install -r requirements-dev.txt
      - name: pytest（模型调用全部 Mock）
        env:
          DEEPSEEK_API_KEY: test-key-not-used
        run: pytest -q

  frontend:
    name: 前端类型检查与构建
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: 配置 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 导航与功能开关一致性测试
        run: npm test
      - name: 类型检查
        run: npx vue-tsc --noEmit
      - name: 生产构建
        run: npx vite build
      - name: 扫描构建产物
        run: python3 ../scripts/scan_secrets.py --root .
